<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Economy News Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #4fd1c5;
    --warn: #f6ad55;
    --up: #48bb78;
    --down: #f56565;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--accent); }
  .updated { color: var(--muted); font-size: 13px; }
  main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .kpi .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .kpi .delta { font-size: 13px; margin-top: 2px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .controls input, .controls select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
  }
  .controls input { flex: 1; min-width: 220px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .article {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .article h2 { margin: 6px 0 4px; font-size: 17px; }
  .article h2 a { color: var(--text); text-decoration: none; }
  .article h2 a:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .summary { margin: 8px 0 0; color: #c3c9d6; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 30px; }
</style>
</head>
<body>

<header>
  <h1>Token Economy <span>News</span></h1>
  <div class="updated" id="updated"></div>
</header>

<main>
  <section class="kpis">
    <div class="kpi"><div class="label">Articles tracked</div><div class="value" id="kpiCount">0</div></div>
    <div class="kpi"><div class="label">Sources</div><div class="value" id="kpiSources">0</div></div>
    <div class="kpi"><div class="label">Sentiment (shown)</div><div class="value" id="kpiSentiment">–</div></div>
    <div class="kpi"><div class="label">Latest</div><div class="value" id="kpiLatest" style="font-size:15px">–</div></div>
  </section>

  <div class="controls">
    <input type="search" id="search" placeholder="Search headlines, sources, topics…">
    <select id="sort">
      <option value="date">Newest first</option>
      <option value="impact">Highest impact</option>
    </select>
  </div>

  <div class="chips" id="topicChips"></div>
  <div id="list"></div>
</main>

<footer>
  Sample data for layout. Replace the <code>ARTICLES</code> array in this file with your feed (see README notes in chat).
</footer>

<script>
  // ---- DATA ------------------------------------------------------------
  // Each item: date (YYYY-MM-DD), title, url, source, topic, sentiment (-1..1), impact (1..5), summary
  // Sample data, used only if articles.json is missing (see fetch-feeds.mjs).
  let ARTICLES = [
    { date: "2026-11-05", title: "Stablecoin supply hits new high as tokenized treasuries grow", url: "https://example.com/stablecoin-supply", source: "Sample Wire", topic: "Stablecoins", sentiment: 0.4, impact: 4, summary: "Total stablecoin market cap rose again. Tokenized government bills gained share of on-chain collateral." },
    { date: "2026-11-04", title: "Regulators publish draft rules for tokenized securities", url: "https://example.com/tokenized-securities", source: "Sample Wire", topic: "Regulation", sentiment: 0.1, impact: 5, summary: "Draft framework covers custody, transfer agents and investor disclosure for tokenized equities." },
    { date: "2026-11-03", title: "AI agents begin paying for API calls with micro-tokens", url: "https://example.com/ai-agent-payments", source: "Sample Journal", topic: "AI & Tokens", sentiment: 0.6, impact: 3, summary: "Pilot projects let agents settle per-request fees on-chain, cutting billing overhead." },
    { date: "2026-11-01", title: "Utility token unlock schedule pressures price", url: "https://example.com/token-unlocks", source: "Sample Markets", topic: "Tokenomics", sentiment: -0.5, impact: 3, summary: "Large vesting cliff releases supply next quarter. Analysts flag sell pressure risk." },
    { date: "2026-10-29", title: "Central bank pilots wholesale digital settlement token", url: "https://example.com/cbdc-pilot", source: "Sample Wire", topic: "CBDC", sentiment: 0.2, impact: 4, summary: "Interbank pilot tests settlement finality and programmable payments across three banks." },
    { date: "2026-10-27", title: "Protocol fees shift to token buybacks", url: "https://example.com/fee-buybacks", source: "Sample Journal", topic: "Tokenomics", sentiment: 0.5, impact: 2, summary: "Governance vote routes protocol revenue to buy and burn the native token." },
    { date: "2026-10-24", title: "Exchange lists tokenized money market fund for collateral", url: "https://example.com/tokenized-mmf", source: "Sample Markets", topic: "Stablecoins", sentiment: 0.3, impact: 2, summary: "Tokenized fund accepted as margin collateral, widening institutional use cases." },
    { date: "2026-10-20", title: "Token-based loyalty points face scrutiny over redemption terms", url: "https://example.com/loyalty-tokens", source: "Sample Wire", topic: "Regulation", sentiment: -0.3, impact: 2, summary: "Consumer groups question whether reward tokens count as securities or deposits." }
  ];

  // ---- STATE -----------------------------------------------------------
  let activeTopic = "All";
  const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- RENDER ----------------------------------------------------------
  function renderKpis(items) {
    document.getElementById("kpiCount").textContent = items.length;
    document.getElementById("kpiSources").textContent = new Set(ARTICLES.map(a => a.source)).size;
    if (items.length) {
      const avg = items.reduce((s, a) => s + a.sentiment, 0) / items.length;
      const el = document.getElementById("kpiSentiment");
      el.textContent = (avg >= 0 ? "+" : "") + avg.toFixed(2);
      el.className = "value " + (avg >= 0 ? "up" : "down");
      document.getElementById("kpiLatest").textContent = fmtDate(items.reduce((m, a) => a.date > m ? a.date : m, items[0].date));
    } else {
      document.getElementById("kpiSentiment").textContent = "–";
      document.getElementById("kpiLatest").textContent = "–";
    }
  }

  function renderChips() {
    const topics = ["All", ...new Set(ARTICLES.map(a => a.topic))];
    const wrap = document.getElementById("topicChips");
    wrap.innerHTML = topics.map(t =>
      `<button class="chip ${t === activeTopic ? "active" : ""}" data-topic="${esc(t)}">${esc(t)}</button>`
    ).join("");
    wrap.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
      activeTopic = btn.dataset.topic;
      renderChips();
      render();
    }));
  }

  function render() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const sort = document.getElementById("sort").value;

    let items = ARTICLES.filter(a =>
      (activeTopic === "All" || a.topic === activeTopic) &&
      (!q || [a.title, a.source, a.topic, a.summary].join(" ").toLowerCase().includes(q))
    );

    items.sort((a, b) => sort === "impact"
      ? (b.impact - a.impact) || b.date.localeCompare(a.date)
      : b.date.localeCompare(a.date));

    renderKpis(items);

    const list = document.getElementById("list");
    if (!items.length) {
      list.innerHTML = `<div class="empty">No articles match.</div>`;
      return;
    }
    list.innerHTML = items.map(a => `
      <article class="article">
        <div class="meta">
          <span class="tag">${esc(a.topic)}</span>
          <span class="tag ${a.sentiment < 0 ? "warn" : ""}">${a.sentiment >= 0 ? "▲" : "▼"} ${a.sentiment.toFixed(1)}</span>
          <span>Impact ${"●".repeat(a.impact)}${"○".repeat(5 - a.impact)}</span>
        </div>
        <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
        <div class="meta"><span>${esc(a.source)}</span><span>${fmtDate(a.date)}</span></div>
        <p class="summary">${esc(a.summary)}</p>
      </article>`).join("");
  }

  // ---- INIT ------------------------------------------------------------
  document.getElementById("search").addEventListener("input", render);
  document.getElementById("sort").addEventListener("change", render);

  async function loadFeed() {
    const status = document.getElementById("updated");
    try {
      const res = await fetch("articles.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.articles) || !data.articles.length) throw new Error("empty feed");
      ARTICLES = data.articles;
      status.textContent = "Live feed updated " + new Date(data.updated).toLocaleString();
      document.querySelector("footer").textContent = "Source: RSS via fetch-feeds.mjs. Sentiment and topic are keyword heuristics.";
    } catch (err) {
      status.textContent = "Sample data (" + err.message + "). Run fetch-feeds.mjs and serve this folder.";
    }
    renderChips();
    render();
  }
  loadFeed();
</script>
</body>
</html>
